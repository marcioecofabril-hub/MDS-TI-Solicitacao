<form id="formSolicitacao" action="/solicitar" method="POST">

    <div class="field">
        <label for="nome">Nome *</label>
        <input
            id="nome"
            type="text"
            name="nome"
            placeholder="Digite seu nome"
            autocomplete="name"
            required
        >
    </div>

    <!-- CAMPO CORRIGIDO ABAIXO -->
    <div class="field">
        <label for="email">E-mail *</label>
        <input
            id="email"
            type="email"
            name="email"
            placeholder="Digite seu e-mail"
            autocomplete="email"
            required
        >
    </div>

    <div class="field">
        <label for="whatsapp">WhatsApp *</label>
        <input
            id="whatsapp"
            type="tel"
            name="whatsapp"
            placeholder="(11) 99999-9999"
            autocomplete="tel"
            required
        >
    </div>

    <button
        id="botaoEnviar"
        type="submit"
    >
        SOLICITAR TESTE →
    </button>

    <div class="privacy">
        Seus dados serão utilizados exclusivamente
        para contato referente à solicitação do teste.
    </div>

</form>
