<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Solicitação de Teste | MDS_TI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(
                135deg,
                #08162d 0%,
                #102d55 50%,
                #075985 100%
            );
            color: #172033;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .card {
            padding: 36px;
            border-radius: 22px;
            background: #ffffff;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.30);
        }

        .marca {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 92px;
            height: 38px;
            margin-bottom: 22px;
            padding: 0 15px;
            border-radius: 10px;
            color: #ffffff;
            background: #0b67b2;
            font-weight: 800;
            letter-spacing: 1px;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 30px;
            line-height: 1.15;
            color: #10233f;
        }

        .descricao {
            margin-bottom: 28px;
            color: #5e6b7e;
            line-height: 1.6;
        }

        .campo {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 700;
            color: #28384f;
        }

        input {
            width: 100%;
            height: 50px;
            padding: 0 15px;
            border: 1px solid #ccd5e1;
            border-radius: 10px;
            outline: none;
            font-size: 16px;
        }

        input:focus {
            border-color: #0b67b2;
            box-shadow: 0 0 0 4px rgba(11, 103, 178, 0.12);
        }

        button {
            width: 100%;
            height: 52px;
            margin-top: 8px;
            border: 0;
            border-radius: 11px;
            background: #0b67b2;
            color: #ffffff;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #095996;
        }

        button:disabled {
            cursor: not-allowed;
            background: #90a3b8;
        }

        .mensagem {
            display: none;
            margin-top: 20px;
            padding: 17px;
            border-radius: 10px;
            text-align: center;
            font-weight: 700;
            line-height: 1.5;
        }

        .mensagem.sucesso {
            display: block;
            border: 1px solid #86d3a0;
            background: #e9f9ef;
            color: #186735;
        }

        .mensagem.erro {
            display: block;
            border: 1px solid #f0a3a3;
            background: #fff0f0;
            color: #a22222;
        }

        .resultado-teste {
            display: none;
            margin-top: 22px;
        }

        .resultado-teste.ativo {
            display: block;
        }

        .resultado-titulo {
            margin-bottom: 12px;
            color: #10233f;
            font-size: 20px;
        }

        .resultado-conteudo {
            padding: 20px;
            border: 1px solid #d6e1ec;
            border-radius: 12px;
            background: #f5f8fc;
            color: #1c293d;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        .aviso {
            margin-top: 22px;
            color: #738095;
            font-size: 12px;
            line-height: 1.5;
            text-align: center;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .card {
                padding: 27px 21px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <section class="card">

            <div class="marca">
                MDS_TI
            </div>

            <h1>Solicitação de teste</h1>

            <p class="descricao">
                Preencha seus dados para solicitar o teste.
                É permitida somente uma solicitação por e-mail ou WhatsApp.
            </p>

            <form id="formulario">

                <div class="campo">
                    <label for="nome">Nome completo</label>

                    <input
                        id="nome"
                        name="nome"
                        type="text"
                        autocomplete="name"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        maxlength="150"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="celular">WhatsApp com DDD</label>

                    <input
                        id="celular"
                        name="celular"
                        type="tel"
                        inputmode="tel"
                        autocomplete="tel"
                        maxlength="15"
                        placeholder="(11) 99999-9999"
                        required
                    >
                </div>

                <button
                    id="botaoEnviar"
                    type="submit"
                >
                    Solicitar teste
                </button>

            </form>

            <div
                id="mensagem"
                class="mensagem"
                role="alert"
                aria-live="polite"
            ></div>

            <div
                id="resultadoTeste"
                class="resultado-teste"
            >
                <h2 class="resultado-titulo">
                    Dados do seu teste
                </h2>

                <div
                    id="conteudoTeste"
                    class="resultado-conteudo"
                ></div>
            </div>

            <p class="aviso">
                Os dados informados serão utilizados somente para
                atendimento da solicitação.
            </p>

        </section>

    </main>

    <script>

        const formulario =
            document.getElementById("formulario");

        const botaoEnviar =
            document.getElementById("botaoEnviar");

        const mensagem =
            document.getElementById("mensagem");

        const resultadoTeste =
            document.getElementById("resultadoTeste");

        const conteudoTeste =
            document.getElementById("conteudoTeste");

        const inputCelular =
            document.getElementById("celular");


        /*
        ============================================
        MÁSCARA DO WHATSAPP
        ============================================
        */

        inputCelular.addEventListener("input", function (evento) {

            let numeros =
                evento.target.value.replace(/\D/g, "");

            numeros = numeros.substring(0, 11);

            if (numeros.length <= 2) {

                evento.target.value = numeros;

            } else if (numeros.length <= 7) {

                evento.target.value =
                    "(" +
                    numeros.substring(0, 2) +
                    ") " +
                    numeros.substring(2);

            } else {

                evento.target.value =
                    "(" +
                    numeros.substring(0, 2) +
                    ") " +
                    numeros.substring(2, 7) +
                    "-" +
                    numeros.substring(7, 11);
            }

        });


        function mostrarMensagem(texto, tipo) {

            mensagem.textContent = texto;

            mensagem.className =
                "mensagem " + tipo;
        }


        function limparCelular(valor) {

            return valor.replace(/\D/g, "");
        }


        /*
        ============================================
        ENVIO DO FORMULÁRIO
        ============================================
        */

        formulario.addEventListener(
            "submit",
            async function (evento) {

                evento.preventDefault();

                mensagem.className = "mensagem";
                mensagem.textContent = "";

                resultadoTeste.className =
                    "resultado-teste";

                conteudoTeste.textContent = "";


                const nome =
                    document
                        .getElementById("nome")
                        .value
                        .trim();

                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim()
                        .toLowerCase();

                const celular =
                    limparCelular(
                        inputCelular.value
                    );


                if (!nome || !email || !celular) {

                    mostrarMensagem(
                        "Preencha todos os campos corretamente.",
                        "erro"
                    );

                    return;
                }


                if (celular.length < 10) {

                    mostrarMensagem(
                        "Informe um WhatsApp válido com DDD.",
                        "erro"
                    );

                    return;
                }


                botaoEnviar.disabled = true;

                botaoEnviar.textContent =
                    "Registrando solicitação...";


                try {

                    /*
                    ====================================
                    ENVIA PARA O NOSSO FLASK
                    ====================================
                    */

                    const resposta = await fetch(
                        "/registrar",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json",
                                "Accept":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                nome: nome,
                                email: email,
                                celular: celular
                            })
                        }
                    );


                    let dados;

                    try {

                        dados = await resposta.json();

                    } catch (erroJSON) {

                        throw new Error(
                            "O servidor retornou uma resposta inválida."
                        );
                    }


                    if (!resposta.ok) {

                        throw new Error(
                            dados.message ||
                            "Não foi possível processar a solicitação."
                        );
                    }


                    if (!dados.success) {

                        throw new Error(
                            dados.message ||
                            "A solicitação não foi concluída."
                        );
                    }


                    /*
                    ====================================
                    SUCESSO
                    ====================================
                    */

                    formulario.reset();

                    formulario.style.display = "none";


                    mostrarMensagem(
                        dados.message ||
                        "Teste liberado com sucesso.",
                        "sucesso"
                    );


                    conteudoTeste.textContent =
                        dados.template ||
                        "Seu teste MDS_TI foi liberado.";


                    resultadoTeste.className =
                        "resultado-teste ativo";


                } catch (erro) {

                    console.error(
                        "Erro ao enviar:",
                        erro
                    );


                    mostrarMensagem(
                        erro.message ||
                        "Não foi possível processar a solicitação.",
                        "erro"
                    );


                    botaoEnviar.disabled = false;

                    botaoEnviar.textContent =
                        "Solicitar teste";
                }

            }
        );

    </script>

</body>

</html>
