<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Solicitação de Teste | MDS_TI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Arial, Helvetica, sans-serif;
            background:
                linear-gradient(
                    135deg,
                    #08162d 0%,
                    #102d55 50%,
                    #075985 100%
                );
            color: #172033;
        }

        .container {
            width: 100%;
            max-width: 520px;
        }

        .card {
            padding: 36px;
            border-radius: 22px;
            background: #ffffff;
            box-shadow:
                0 24px 60px rgba(0, 0, 0, 0.3);
        }

        .marca {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 92px;
            height: 38px;
            margin-bottom: 22px;
            border-radius: 10px;
            color: #ffffff;
            background: #0b67b2;
            font-weight: 800;
            letter-spacing: 1px;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 30px;
            line-height: 1.15;
            color: #10233f;
        }

        .descricao {
            margin-bottom: 28px;
            color: #5e6b7e;
            line-height: 1.6;
        }

        .campo {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 700;
            color: #28384f;
        }

        input {
            width: 100%;
            height: 50px;
            padding: 0 15px;
            border: 1px solid #ccd5e1;
            border-radius: 10px;
            outline: none;
            font-size: 16px;
        }

        input:focus {
            border-color: #0b67b2;
            box-shadow:
                0 0 0 4px rgba(11, 103, 178, 0.12);
        }

        button {
            width: 100%;
            height: 52px;
            margin-top: 8px;
            border: 0;
            border-radius: 11px;
            background: #0b67b2;
            color: #ffffff;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
        }

        button:hover {
            background: #095996;
        }

        button:disabled {
            cursor: not-allowed;
            background: #90a3b8;
        }

        .mensagem {
            display: none;
            margin-top: 20px;
            padding: 17px;
            border-radius: 10px;
            text-align: center;
            font-weight: 700;
            line-height: 1.5;
        }

        .mensagem.sucesso {
            display: block;
            border: 1px solid #86d3a0;
            background: #e9f9ef;
            color: #186735;
        }

        .mensagem.erro {
            display: block;
            border: 1px solid #f0a3a3;
            background: #fff0f0;
            color: #a22222;
        }

        .aviso {
            margin-top: 22px;
            color: #738095;
            font-size: 12px;
            line-height: 1.5;
            text-align: center;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .card {
                padding: 27px 21px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <section class="card">

            <div class="marca">
                MDS_TI
            </div>

            <h1>
                Solicitação de teste
            </h1>

            <p class="descricao">
                Preencha seus dados para solicitar o teste.
                É permitida somente uma solicitação por
                e-mail ou celular.
            </p>

            <form id="formulario">

                <div class="campo">
                    <label for="nome">
                        Nome completo
                    </label>

                    <input
                        id="nome"
                        type="text"
                        autocomplete="name"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="email">
                        E-mail
                    </label>

                    <input
                        id="email"
                        type="email"
                        autocomplete="email"
                        maxlength="150"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="celular">
                        WhatsApp com DDD
                    </label>

                    <input
                        id="celular"
                        type="tel"
                        inputmode="tel"
                        autocomplete="tel"
                        maxlength="20"
                        placeholder="(11) 99999-9999"
                        required
                    >
                </div>

                <button
                    id="botaoEnviar"
                    type="submit"
                >
                    Solicitar teste
                </button>

            </form>

            <div
                id="mensagem"
                class="mensagem"
                role="alert"
                aria-live="polite"
            ></div>

            <p class="aviso">
                Os dados serão utilizados somente para
                atendimento da solicitação.
            </p>

        </section>

    </main>


    <script>
        const WEB3FORMS_ACCESS_KEY =
            {{ web3forms_access_key | tojson }};


        const formulario =
            document.getElementById("formulario");

        const botaoEnviar =
            document.getElementById("botaoEnviar");

        const mensagem =
            document.getElementById("mensagem");


        function mostrarMensagem(texto, tipo) {

            mensagem.textContent = texto;

            mensagem.className =
                "mensagem " + tipo;
        }


        function limparCelular(valor) {

            return valor.replace(
                /\D/g,
                ""
            );
        }


        formulario.addEventListener(
            "submit",

            async function (evento) {

                evento.preventDefault();

                mensagem.className = "mensagem";
                mensagem.textContent = "";


                const nome =
                    document
                        .getElementById("nome")
                        .value
                        .trim();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim()
                        .toLowerCase();


                const celular =
                    limparCelular(
                        document
                            .getElementById("celular")
                            .value
                    );


                if (!nome || !email || !celular) {

                    mostrarMensagem(
                        "Preencha todos os campos.",
                        "erro"
                    );

                    return;
                }


                if (!WEB3FORMS_ACCESS_KEY) {

                    mostrarMensagem(
                        "Serviço de envio não configurado.",
                        "erro"
                    );

                    return;
                }


                botaoEnviar.disabled = true;

                botaoEnviar.textContent =
                    "Processando solicitação...";


                try {

                    /*
                    ========================================
                    PASSO 1
                    Registra o cliente e consulta a API
                    ========================================
                    */

                    const respostaRegistro =
                        await fetch(
                            "/registrar",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    nome: nome,
                                    email: email,
                                    celular: celular
                                })
                            }
                        );


                    const resultado =
                        await respostaRegistro.json();


                    if (!respostaRegistro.ok) {

                        throw new Error(
                            resultado.message ||
                            "Não foi possível processar a solicitação."
                        );
                    }


                    /*
                    ========================================
                    A RESPOSTA DO APP.PY POSSUI:

                    resultado.cliente
                    resultado.dados_api
                    ========================================
                    */


                    const dadosCliente =
                        resultado.cliente || {};


                    const dadosAPI =
                        resultado.dados_api || "";


                    /*
                    ========================================
                    MONTA O E-MAIL
                    ========================================
                    */

                    const conteudoEmail =
`
NOVA SOLICITAÇÃO DE TESTE

=====================================
DADOS DO CLIENTE
=====================================

Nome: ${dadosCliente.nome || nome}

E-mail: ${dadosCliente.email || email}

WhatsApp: ${dadosCliente.celular || celular}

Data da solicitação:
${dadosCliente.data_solicitacao || ""}


=====================================
DADOS RECEBIDOS DA API
=====================================

${dadosAPI}

=====================================

Solicitação registrada pelo sistema MDS_TI.
`;


                    /*
                    ========================================
                    PASSO 2
                    ENVIA PARA WEB3FORMS
                    ========================================
                    */

                    botaoEnviar.textContent =
                        "Enviando solicitação...";


                    const respostaEmail =
                        await fetch(
                            "https://api.web3forms.com/submit",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json",

                                    "Accept":
                                        "application/json"
                                },

                                body: JSON.stringify({

                                    access_key:
                                        WEB3FORMS_ACCESS_KEY,

                                    subject:
                                        "Nova solicitação de teste | " +
                                        nome,

                                    from_name:
                                        "MDS_TI - Solicitação",

                                    name:
                                        nome,

                                    email:
                                        email,

                                    whatsapp:
                                        celular,

                                    message:
                                        conteudoEmail
                                })
                            }
                        );


                    const resultadoEmail =
                        await respostaEmail.json();


                    if (
                        !respostaEmail.ok ||
                        !resultadoEmail.success
                    ) {

                        throw new Error(
                            resultadoEmail.message ||
                            "Não foi possível enviar o e-mail."
                        );
                    }


                    /*
                    ========================================
                    SUCESSO

                    O CLIENTE NÃO VÊ OS DADOS DA API.
                    ========================================
                    */

                    formulario.reset();

                    formulario.style.display =
                        "none";


                    mostrarMensagem(
                        "Solicitação enviada com sucesso. " +
                        "Aguarde o contato.",
                        "sucesso"
                    );

                }

                catch (erro) {

                    console.error(
                        "Erro:",
                        erro
                    );


                    mostrarMensagem(
                        erro.message ||
                        "Não foi possível enviar a solicitação.",
                        "erro"
                    );


                    botaoEnviar.disabled =
                        false;


                    botaoEnviar.textContent =
                        "Solicitar teste";
                }
            }
        );
    </script>

</body>
</html>
