<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#071a2f"
    >

    <title>MDS_TI | Solicitação</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                radial-gradient(
                    circle at 15% 10%,
                    rgba(0, 157, 255, 0.30),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 90% 85%,
                    rgba(0, 213, 255, 0.18),
                    transparent 38%
                ),
                linear-gradient(
                    145deg,
                    #04111f 0%,
                    #071f39 55%,
                    #063d5e 100%
                );
        }

        .container {
            width: 100%;
            max-width: 650px;

            display: flex;
            flex-direction: column;
            align-items: center;

            gap: 22px;
        }

        .banner-link {
            display: block;

            width: 100%;

            border-radius: 22px;

            overflow: hidden;

            box-shadow:
                0 20px 55px
                rgba(0, 0, 0, 0.45);

            text-decoration: none;

            transition:
                transform 0.20s ease,
                box-shadow 0.20s ease;
        }

        .banner-link:hover {
            transform: translateY(-4px);

            box-shadow:
                0 26px 65px
                rgba(0, 0, 0, 0.55);
        }

        .banner-link:active {
            transform: scale(0.99);
        }

        .banner {
            display: block;

            width: 100%;
            height: auto;
        }

        .botao-acessar {
            width: 100%;
            max-width: 380px;

            min-height: 58px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 15px 35px;

            border: 1px solid
                rgba(80, 210, 255, 0.40);

            border-radius: 14px;

            color: #ffffff;

            background:
                linear-gradient(
                    135deg,
                    #008be8,
                    #0065b3
                );

            text-decoration: none;

            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1.5px;

            cursor: pointer;

            box-shadow:
                0 10px 30px
                rgba(0, 139, 232, 0.35);

            transition:
                transform 0.20s ease,
                box-shadow 0.20s ease,
                background 0.20s ease;
        }

        .botao-acessar:hover {
            transform: translateY(-3px);

            background:
                linear-gradient(
                    135deg,
                    #00a1ff,
                    #0875c1
                );

            box-shadow:
                0 15px 35px
                rgba(0, 161, 255, 0.45);
        }

        .botao-acessar:active {
            transform: scale(0.98);
        }

        @media (max-width: 600px) {

            body {
                padding: 16px;
            }

            .container {
                gap: 17px;
            }

            .banner-link {
                border-radius: 16px;
            }

            .botao-acessar {
                max-width: none;
                min-height: 56px;
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <!-- BANNER -->
        <a
            class="banner-link"
            href="https://mds-ti-solicitacao.onrender.com/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Acessar solicitação MDS_TI"
        >

            <img
                class="banner"
                src="{{ url_for('static', filename='banner-mds-ti.png') }}"
                alt="MDS_TI"
            >

        </a>


        <!-- BOTÃO ACESSAR -->
        <a
            class="botao-acessar"
            href="https://mds-ti-solicitacao.onrender.com/"
            target="_blank"
            rel="noopener noreferrer"
        >
            ACESSAR
        </a>

    </main>

</body>

</html>
`
